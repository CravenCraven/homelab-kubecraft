apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallabag
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: wallabag-forwarded-proto-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: wallabag.projectpattie.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallabag
                port:
                  number: 80
