apiVersion: apps/v1
kind: Deployment
metadata:
  name: commafeed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: commafeed
  template:
    metadata:
      labels:
        app: commafeed
    spec:
      enableServiceLinks: false
      nodeSelector:
        workload: heavy
      containers:
        - name: commafeed
          image: athou/commafeed:7.4.1-postgresql
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: TZ
              value: America/New_York
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: commafeed-secrets
                  key: POSTGRES_DB
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://commafeed-postgres:5432/$(POSTGRES_DB)
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: commafeed-secrets
                  key: POSTGRES_USER
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commafeed-secrets
                  key: POSTGRES_PASSWORD
            - name: QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: commafeed-secrets
                  key: SESSION_KEY
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
