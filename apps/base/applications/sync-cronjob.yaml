---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: applications-sync
  namespace: applications
spec:
  schedule: "0 * * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            workload: heavy
          containers:
            - name: sync
              image: python:3.12-slim
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  pip install --quiet --no-cache-dir \
                    "psycopg[binary]==3.2.3" \
                    "google-api-python-client==2.149.0" \
                    "google-auth==2.35.0"
                  python /app/sync_applications.py
              env:
                # CNPG writes a ready-made connection string into this secret.
                - name: APPLICATIONS_DSN
                  valueFrom:
                    secretKeyRef:
                      name: applications-db-app
                      key: uri
                - name: GOOGLE_KEY_FILE
                  value: /secrets/sheets-key.json
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: sheets-key
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: script
              configMap:
                name: applications-sync-script
            - name: sheets-key
              secret:
                secretName: applications-sheets-key
