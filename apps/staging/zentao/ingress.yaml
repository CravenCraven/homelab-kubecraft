apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zentao
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: zentao-authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: zentao.projectpattie.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zentao
                port:
                  number: 80
