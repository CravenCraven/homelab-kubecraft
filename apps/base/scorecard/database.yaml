apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: scorecard-db
  namespace: scorecard
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 2Gi
    storageClass: local-path
  affinity:
    nodeSelector:
      workload: heavy
  bootstrap:
    initdb:
      database: scorecard
      owner: scorecard
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
